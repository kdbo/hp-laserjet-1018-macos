name: Build HP LaserJet 1018 Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15

    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_APPLICATION_IDENTITY: ${{ vars.APPLE_APPLICATION_IDENTITY }}
      APPLE_INSTALLER_IDENTITY: ${{ vars.APPLE_INSTALLER_IDENTITY }}

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Validate version tag
      #
      # Git tag:
      #   v1.0.3
      #
      # Package version:
      #   1.0.3
      # ------------------------------------------------------------

      - name: Validate version tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "ERROR: This workflow must be run from a version tag."
            exit 1
          fi

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version tag: $GITHUB_REF_NAME"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"

          echo "Git tag:       $GITHUB_REF_NAME"
          echo "Package version: $VERSION"

      # ------------------------------------------------------------
      # Show build environment
      # ------------------------------------------------------------

      - name: Show build environment
        run: |
          sw_vers
          uname -m
          clang --version
          which pkgbuild
          which productsign
          which codesign

      # ------------------------------------------------------------
      # Create temporary signing keychain
      # ------------------------------------------------------------

      - name: Create temporary signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/hp1018-signing.keychain-db"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

      # ------------------------------------------------------------
      # Import Developer ID Application certificate
      # ------------------------------------------------------------

      - name: Import Developer ID Application certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APPLICATION_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/hp1018-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/application.p12"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          echo "Decoded Application P12 SHA256:"
          shasum -a 256 "$CERTIFICATE_PATH"

          echo "Testing P12 password with OpenSSL..."

          openssl pkcs12 \
            -in "$CERTIFICATE_PATH" \
            -noout \
            -passin "pass:$CERTIFICATE_PASSWORD"

          echo "P12 password accepted by OpenSSL."

          security import "$CERTIFICATE_PATH" \
            -f pkcs12 \
            -P "$CERTIFICATE_PASSWORD" \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign

          rm -f "$CERTIFICATE_PATH"

      # ------------------------------------------------------------
      # Import Developer ID Installer certificate
      # ------------------------------------------------------------

      - name: Import Developer ID Installer certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/hp1018-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/installer.p12"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          echo "Decoded Installer P12 SHA256:"
          shasum -a 256 "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" \
            -f pkcs12 \
            -P "$CERTIFICATE_PASSWORD" \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/productsign

          rm -f "$CERTIFICATE_PATH"

      # ------------------------------------------------------------
      # Configure keychain access
      # ------------------------------------------------------------

      - name: Configure keychain access
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/hp1018-signing.keychain-db"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      # ------------------------------------------------------------
      # Verify signing identities
      # ------------------------------------------------------------

      - name: Verify signing identities
        run: |
          echo "Code signing identities:"
          security find-identity -v -p codesigning

          echo ""
          echo "Installer identities:"
          security find-identity -v -p basic

      # ------------------------------------------------------------
      # Build rastertozjs x86_64
      # ------------------------------------------------------------

      - name: Build rastertozjs x86_64
        run: |
          clang -arch x86_64 \
            -o rastertozjs-x86_64 \
            rastertozjs.c \
            foo2zjs/jbig.c \
            foo2zjs/jbig_ar.c \
            -Ifoo2zjs \
            -lcups \
            -lcupsimage \
            -Wall \
            -O2

          file rastertozjs-x86_64

      # ------------------------------------------------------------
      # Build rastertozjs arm64
      # ------------------------------------------------------------

      - name: Build rastertozjs arm64
        run: |
          clang -arch arm64 \
            -o rastertozjs-arm64 \
            rastertozjs.c \
            foo2zjs/jbig.c \
            foo2zjs/jbig_ar.c \
            -Ifoo2zjs \
            -lcups \
            -lcupsimage \
            -Wall \
            -O2

          file rastertozjs-arm64

      # ------------------------------------------------------------
      # Create universal binary
      # ------------------------------------------------------------

      - name: Create universal binary
        run: |
          lipo -create \
            rastertozjs-x86_64 \
            rastertozjs-arm64 \
            -output rastertozjs-universal

          file rastertozjs-universal
          lipo -info rastertozjs-universal

      # ------------------------------------------------------------
      # Sign rastertozjs
      # ------------------------------------------------------------

      - name: Sign rastertozjs
        run: |
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$APPLE_APPLICATION_IDENTITY" \
            rastertozjs-universal

      # ------------------------------------------------------------
      # Verify rastertozjs signature
      # ------------------------------------------------------------

      - name: Verify rastertozjs signature
        run: |
          codesign -dvvv rastertozjs-universal 2>&1

          codesign \
            --verify \
            --strict \
            --verbose=4 \
            rastertozjs-universal

          codesign \
            --verify \
            --strict \
            --verbose=4 \
            --arch x86_64 \
            rastertozjs-universal

          codesign \
            --verify \
            --strict \
            --verbose=4 \
            --arch arm64 \
            rastertozjs-universal

      # ------------------------------------------------------------
      # Prepare package build tree
      # ------------------------------------------------------------
      - name: Check package source tree
        run: |
          echo "Repository:"
          pwd

          echo ""
          echo "Top level:"
          ls -la

          echo ""
          echo "pkg:"
          ls -la pkg || true

          echo ""
          echo "pkg files:"
          find pkg -maxdepth 6 -type f -print 2>/dev/null | sort || true
          
      - name: Prepare package build tree
        run: |
          rm -rf pkg-build

          mkdir -p pkg-build

          cp -R pkg/root pkg-build/
          cp -R pkg/scripts pkg-build/

          ls -l pkg-build/root/usr/local/libexec/
          ls -l pkg-build/root/usr/local/
          ls -l pkg-build/root/Library/LaunchDaemons/

          mkdir -p pkg-build/root/usr/libexec/cups/filter

          cp rastertozjs-universal \
            pkg-build/root/usr/libexec/cups/filter/rastertozjs

          chmod 755 \
            pkg-build/root/usr/libexec/cups/filter/rastertozjs

      # ------------------------------------------------------------
      # Verify project-specific runtime files
      # ------------------------------------------------------------

      - name: Verify package source files
        run: |
          test -f pkg-build/root/usr/local/libexec/hp1018/watch.sh
          test -f pkg-build/root/usr/local/share/hp1018/sihp1018.dl
          test -f pkg-build/root/Library/LaunchDaemons/com.kdbo.hp1018-firmware.plist
          test -f pkg-build/root/Library/LaunchDaemons/com.kdbo.hp1018.airprint.plist
          test -f "pkg-build/root/Library/Application Support/HP1018/airprint.sh"
          test -f pkg-build/scripts/postinstall

      # ------------------------------------------------------------
      # Build unsigned installer package
      # ------------------------------------------------------------

      - name: Build package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          pkgbuild \
            --root pkg-build/root \
            --scripts pkg-build/scripts \
            --identifier com.kdbo.hp1018 \
            --version "$VERSION" \
            --install-location / \
            "HP1018-${VERSION}.pkg"

            echo "UNSIGNED_PACKAGE=HP1018-${VERSION}.pkg" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Inspect package
      # ------------------------------------------------------------

      - name: Inspect package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          pkgutil --check-signature \
            "HP1018-${VERSION}.pkg" || true

          rm -rf /tmp/hp1018-package-check

          pkgutil --expand-full \
            "HP1018-${VERSION}.pkg" \
            /tmp/hp1018-package-check

          file \
            /tmp/hp1018-package-check/Payload/usr/libexec/cups/filter/rastertozjs

      # ------------------------------------------------------------
      # Sign installer package
      # ------------------------------------------------------------

      - name: Sign installer package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          productsign \
            --sign "$APPLE_INSTALLER_IDENTITY" \
            "HP1018-${VERSION}.pkg" \
            "HP1018-${VERSION}-signed.pkg"

      # ------------------------------------------------------------
      # Verify installer signature
      # ------------------------------------------------------------

      - name: Verify installer signature
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          pkgutil --check-signature \
            "HP1018-${VERSION}-signed.pkg"

          echo "SIGNED_PACKAGE=HP1018-${VERSION}-signed.pkg" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Upload package as GitHub Actions artifact
      # ------------------------------------------------------------
      - name: Upload Signed package
        uses: actions/upload-artifact@v4
        with:
          name: HP1018 ${{ github.ref_name }} Signed
          path: ${{ env.SIGNED_PACKAGE }}
          if-no-files-found: error
      - name: Upload Unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: HP1018 ${{ github.ref_name }}
          path: ${{ env.UNSIGNED_PACKAGE }}
          if-no-files-found: error
      # ------------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------------

      - name: Remove temporary signing keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/hp1018-signing.keychain-db"

          security delete-keychain \
            "$KEYCHAIN_PATH" 2>/dev/null || true